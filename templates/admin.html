<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Admin Dashboard</title>
    
    <!-- Link to the external CSS file for styling -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation bar -->
    <nav>
        <!-- Left side of the navbar with logo -->
        <div class="nav-left">
            <a href="/" class="logo">Admin Dashboard</a>
        </div>
        
        <!-- Right side of the navbar with links -->
        <div class="nav-right">
            <a href="/">Home</a> <!-- Link to the home page -->
            <a href="#" id="logoutLink">Logout</a> <!-- Logout link -->
        </div>
    </nav>

    <!-- Main content container -->
    <div class="container">
        <!-- Page heading -->
        <h1>Admin Panel</h1>
        
        <!-- Users section -->
        <div class="admin-section">
            <h2>Users</h2>
            <!-- Container to display the list of users -->
            <div id="usersList" class="admin-table"></div>
        </div>

        <!-- Videos section -->
        <div class="admin-section">
            <h2>Videos</h2>
            <!-- Container to display the list of videos -->
            <div id="videosList" class="admin-table"></div>
        </div>
    </div>

    <!-- Link to the external JavaScript file for interactivity -->
    <script src="/static/script.js"></script>
</body>
</html>

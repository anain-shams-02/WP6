<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Upload Video</title>
    
    <!-- Link to the external CSS file for styling -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation bar -->
    <nav>
        <!-- Left side of the navbar with logo -->
        <div class="nav-left">
            <a href="/" class="logo">Nature Wonders</a>
        </div>
        
        <!-- Right side of the navbar with links -->
        <div class="nav-right">
            <a href="/">Home</a> <!-- Link to the home page -->
            <a href="#" id="logoutLink">Logout</a> <!-- Logout link -->
        </div>
    </nav>

    <!-- Main content container for the upload form -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Form heading -->
            <h2>Upload Video</h2>
            
            <!-- Video upload form -->
            <form id="uploadForm" enctype="multipart/form-data">
                <!-- Title input field -->
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <!-- Description textarea -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                
                <!-- File input for video upload -->
                <div class="form-group">
                    <label for="file">Video File</label>
                    <input type="file" id="file" name="file" accept="video/*" required>
                </div>
                
                <!-- Submit button -->
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>

    <!-- Link to the external JavaScript file for interactivity -->
    <script src="/static/script.js"></script>
</body>
</html>

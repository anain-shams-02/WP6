<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Login - Video Portal</title>
    
    <!-- Link to the external CSS file for styling -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation bar -->
    <nav>
        <!-- Left side of the navbar with logo -->
        <div class="nav-left">
            <a href="/" class="logo">Nature Wonders</a>
        </div>
        
        <!-- Right side of the navbar with links -->
        <div class="nav-right">
            <a href="/register">Register</a> <!-- Link to the registration page -->
            <a href="/" id="loginLink" style="display: none;">Login</a> <!-- Login link (hidden by default) -->
            <a href="/upload" id="uploadLink" style="display: none;">Upload</a> <!-- Upload link (hidden by default) -->
            <a href="/admin" id="adminLink" style="display: none;">Admin</a> <!-- Admin link (hidden by default) -->
            <span id="usernameDisplay"></span> <!-- Placeholder to display the logged-in username -->
            <a href="#" id="logoutLink" style="display: none;">Logout</a> <!-- Logout link (hidden by default) -->
        </div>
    </nav>

    <!-- Main content container for the login form -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Form heading -->
            <h2>Welcome Back</h2>
            
            <!-- Login form -->
            <form id="loginForm">
                <!-- Email input field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <!-- Password input field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <!-- Submit button -->
                <button type="submit">Login</button>
            </form>
            
            <!-- Redirect link to the registration page -->
            <p class="auth-redirect">
                Don't have an account? <a href="/register">Create one</a>
            </p>
        </div>
    </div>

    <!-- Link to the external JavaScript file for interactivity -->
    <script src="/static/script.js"></script>
</body>
</html>

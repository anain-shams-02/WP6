<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Video Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/" class="logo">Nature Wonders</a>
        </div>
        <div class="nav-right">
            <a href="/register">Register</a>
            <a href="/" id="loginLink" style="display: none;">Login</a>
            <a href="/upload" id="uploadLink" style="display: none;">Upload</a>
            <a href="/admin" id="adminLink" style="display: none;">Admin</a>
            <span id="usernameDisplay"></span>
            <a href="#" id="logoutLink" style="display: none;">Logout</a>
        </div>
    </nav>
    

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit">Login</button>
            </form>
            <p class="auth-redirect">
                Don't have an account? <a href="/register">Create one</a>
            </p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
